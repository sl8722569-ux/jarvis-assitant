<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>J.A.R.V.I.S</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#05080f" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="../icons/jarvis-32.png" />
  <link rel="apple-touch-icon" href="../icons/jarvis-192.png" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="shell">
    <header>
      <img src="../icons/jarvis-64.png" width="44" height="44" alt="" />
      <div>
        <h1>J.A.R.V.I.S</h1>
        <p id="status">STANDBY · INSAN CREATIONS</p>
      </div>
      <button type="button" id="install" hidden>Install app</button>
    </header>
    <div class="modes">
      <button type="button" data-mode="full" class="on">Full</button>
      <button type="button" data-mode="sidebar">Sidebar</button>
      <button type="button" data-mode="voice">Voice-like</button>
    </div>
    <div id="log" class="log"></div>
    <form id="bar">
      <input id="q" autocomplete="off" placeholder="Type to J.A.R.V.I.S…" />
      <button type="submit">Send</button>
    </form>
    <p class="fine">App on every device: Install / Add to Home Screen. Desktop Windows also has JARVIS.exe.</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
