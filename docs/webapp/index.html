<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>J.A.R.V.I.S</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#05080f" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="../icons/jarvis-32.png" />
  <link rel="apple-touch-icon" href="../icons/jarvis-192.png" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="shell">
    <header>
      <img src="../icons/jarvis-64.png" width="44" height="44" alt="" />
      <div>
        <h1>J.A.R.V.I.S</h1>
        <p id="status">STANDBY · type or speak</p>
      </div>
      <select id="lang" title="Response language">
        <option value="auto">Auto</option>
        <option value="en">English</option>
        <option value="hi">Hindi</option>
        <option value="pa">Punjabi</option>
      </select>
      <button type="button" id="install" hidden>Install app</button>
    </header>
    <div id="log" class="log"></div>
    <p class="fine" id="ai-st">This is the web companion. Windows app launching lives in JARVIS.exe.</p>
    <form id="bar">
      <textarea id="q" rows="2" placeholder="Type a command or question…"></textarea>
      <button type="submit" id="send">SEND</button>
    </form>
    <div class="tools">
      <button type="button" id="mic">Mic</button>
      <button type="button" id="stop">Stop</button>
      <button type="button" id="copy">Copy</button>
      <button type="button" id="clear">Clear</button>
      <button type="button" id="regen">Regenerate</button>
    </div>
    <p class="fine">Enter sends · Shift+Enter new line. Voice uses the browser if it supports speech recognition.</p>
  </div>
  <script src="https://sl8722569-ux.github.io/insan-creations/js/bridge-client.js"></script>
  <script src="app.js"></script>
  <script src="https://sl8722569-ux.github.io/insan-creations/js/stats.js" data-app="jarvis"></script>
</body>
</html>
